<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxpop — Requisiciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: #e2ddd8;
    --border2: #cec9c2;
    --text: #1a1916;
    --text2: #6b6760;
    --text3: #a09c97;
    --accent: #1a1916;
    --accent-text: #ffffff;
    --purple-bg: #eeecfe; --purple-text: #3c3489;
    --teal-bg: #e0f5ee; --teal-text: #0f6e56;
    --amber-bg: #faeeda; --amber-text: #854f0b;
    --coral-bg: #faece7; --coral-text: #993c1d;
    --blue-bg: #e6f1fb; --blue-text: #185fa5;
    --green-bg: #eaf3de; --green-text: #3b6d11;
    --red-bg: #fcebeb; --red-text: #a32d2d;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 16px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }

  /* ── LAYOUT ── */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 10; }
  .main { margin-left: 220px; flex: 1; display: flex; flex-direction: column; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 28px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 9; }
  .content { padding: 28px; max-width: 1400px; width: 100%; }
  .form-card-wide { margin-left: -28px; margin-right: -28px; border-left: none; border-right: none; border-radius: 0; box-shadow: none; }

  /* ── SIDEBAR ── */
  .sidebar-logo { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
  .logo-text { font-size: 16px; font-weight: 600; letter-spacing: -.3px; }
  .logo-sub { font-size: 11px; color: var(--text3); margin-top: 2px; font-family: 'DM Mono', monospace; }
  .sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius); cursor: pointer; font-size: 13px; color: var(--text2); transition: all .15s; border: none; background: none; width: 100%; text-align: left; position: relative; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent); color: var(--accent-text); font-weight: 500; }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-badge { background: #e24b4a; color: #fff; border-radius: 10px; padding: 1px 6px; font-size: 10px; font-weight: 600; margin-left: auto; }
  .sidebar-bottom { padding: 14px 10px; border-top: 1px solid var(--border); }
  .role-selector { width: 100%; font-size: 12px; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); cursor: pointer; font-family: 'DM Sans', sans-serif; }

  /* ── TOPBAR ── */
  .page-title { font-size: 15px; font-weight: 600; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--purple-bg); color: var(--purple-text); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }

  /* ── PAGES ── */
  .page { display: none; }
  .page.active { display: block; }

  /* ── TYPE TABS ── */
  .type-tabs { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
  .type-tab { padding: 7px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text2); transition: all .15s; font-family: 'DM Sans', sans-serif; }
  .type-tab:hover { border-color: var(--border2); color: var(--text); }
  .type-tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 500; }

  /* ── FORM ── */
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .form-card-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .form-full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .4px; }
  .field input, .field select, .field textarea {
    font-size: 13px; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text); width: 100%; font-family: 'DM Sans', sans-serif;
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 80px; }

  /* ── ROWS TABLE ── */
  .rows-wrap { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 12px; }
  .rows-head { display: grid; padding: 8px 14px; background: var(--surface2); font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .4px; gap: 6px; }
  .row-item { display: grid; gap: 6px; padding: 7px 14px; border-top: 1px solid var(--border); align-items: center; }
  .row-item input, .row-item select {
    font-size: 11px; padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); font-family: 'DM Sans', sans-serif; width: 100%;
  }
  .row-item input:focus, .row-item select:focus { outline: none; border-color: var(--accent); }
  .btn-del { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; }
  .btn-del:hover { border-color: #e24b4a; color: #e24b4a; background: var(--red-bg); }

  /* ── BUTTONS ── */
  .btn-add { width: 100%; font-size: 12px; color: var(--text2); background: none; border: 1px dashed var(--border2); border-radius: var(--radius); padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 4px; transition: all .15s; font-family: 'DM Sans', sans-serif; }
  .btn-add:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); }
  .btn-primary { background: var(--accent); color: var(--accent-text); border: none; padding: 9px 20px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-family: 'DM Sans', sans-serif; transition: opacity .15s; }
  .btn-primary:hover { opacity: .85; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 9px 16px; border-radius: var(--radius); font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all .15s; }
  .btn-secondary:hover { background: var(--surface2); }
  .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; border: none; transition: opacity .15s; }
  .btn-sm:hover { opacity: .75; }
  .btn-approve { background: var(--teal-bg); color: var(--teal-text); }
  .btn-reject  { background: var(--red-bg);  color: var(--red-text); }
  .btn-action  { background: var(--blue-bg); color: var(--blue-text); }
  .btn-ghost { padding: 8px 16px; background: none; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text2); cursor: pointer; }

  /* ── VALIDATION ── */
  .validation-panel { background:var(--red-bg); border:1px solid var(--red-text); border-radius:var(--radius-lg); padding:14px 18px; margin-bottom:16px; }
  .vp-header { display:flex; align-items:center; gap:8px; color:var(--red-text); font-size:13px; margin-bottom:10px; }
  .vp-list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px; }
  .vp-item { display:flex; align-items:flex-start; gap:6px; font-size:12px; color:var(--red-text); padding:6px 10px; background:rgba(255,255,255,.45); border-radius:6px; cursor:pointer; transition:background .15s; }
  .vp-item:hover { background:rgba(255,255,255,.75); text-decoration:underline; }
  .field-highlight, .field-error-highlight { outline:2px solid var(--red-text) !important; outline-offset:2px; background:var(--red-bg) !important; }

  /* ── AUTH / REQ CARDS ── */
  .auth-card, .req-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px 20px; margin-bottom:12px; box-shadow:var(--shadow); }
  .auth-card-head, .req-card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .auth-card-left, .req-card-left { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .auth-folio, .req-folio { font-family:'DM Mono',monospace; font-size:12px; color:var(--text3); }
  .auth-card-body, .req-card-body { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px 16px; margin-bottom:12px; }
  .auth-label, .req-info-label { font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:.4px; }
  .auth-value, .req-info-value { font-size:13px; color:var(--text); }
  .auth-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .auth-chip { font-size:11px; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:3px 9px; color:var(--text2); }
  .auth-card-actions, .req-card-actions { display:flex; gap:8px; justify-content:flex-end; padding-top:12px; border-top:1px solid var(--border); flex-wrap:wrap; }

  /* ── BADGES ── */
  .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .badge-draft       { background: var(--surface2);  color: var(--text3); }
  .badge-pending     { background: var(--amber-bg);  color: var(--amber-text); }
  .badge-autorizado  { background: var(--teal-bg);   color: var(--teal-text); }
  .badge-rechazado   { background: var(--red-bg);    color: var(--red-text); }
  .badge-dispersado  { background: var(--blue-bg);   color: var(--blue-text); }
  .badge-type        { background: var(--surface2);  color: var(--text2); font-size: 11px; padding: 2px 8px; border-radius: 20px; }
  /* Requisiciones badge colors */
  .badge-pendiente   { background: var(--amber-bg);  color: var(--amber-text); }
  .badge-aprobada    { background: var(--teal-bg);   color: var(--teal-text); }
  .badge-rechazada   { background: var(--red-bg);    color: var(--red-text); }
  .badge-compras     { background: var(--blue-bg);   color: var(--blue-text); }
  .badge-entregada   { background: var(--teal-bg);   color: var(--teal-text); }
  .badge-parcial     { background: var(--amber-bg);  color: var(--amber-text); }
  /* Prioridades */
  .prio-alto  { background:var(--coral-bg); color:var(--coral-text); padding:2px 8px; border-radius:20px; font-size:10px; font-weight:600; }
  .prio-medio { background:var(--amber-bg); color:var(--amber-text); padding:2px 8px; border-radius:20px; font-size:10px; font-weight:600; }
  .prio-bajo  { background:var(--teal-bg);  color:var(--teal-text);  padding:2px 8px; border-radius:20px; font-size:10px; font-weight:600; }

  /* ── METRICS ── */
  .metrics-grid, .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; box-shadow: var(--shadow); }
  .metric-label { font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
  .metric-value, .metric-val { font-size: 22px; font-weight: 600; }

  /* ── TABLE ── */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
  .conc-table, .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .conc-table th, .data-table th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .4px; background: var(--surface2); border-bottom: 1px solid var(--border); }
  .conc-table td, .data-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  .conc-table tr:last-child td, .data-table tr:last-child td { border-bottom: none; }
  .conc-table tr:hover td, .data-table tr:hover td { background: var(--surface2); }
  .folio { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2); }

  /* ── FILTER BAR ── */
  .filter-bar, .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filter-bar select, .filter-bar input,
  .filter-select, .search-input {
    font-size: 12px; padding: 7px 11px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text); font-family: 'DM Sans', sans-serif;
  }
  .filter-bar input, .search-input { min-width: 200px; }
  .filter-bar select:focus, .filter-bar input:focus,
  .filter-select:focus, .search-input:focus { outline: none; border-color: var(--accent); }

  /* ── SEMÁFORO ── */
  .semaforo { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }
  .sem-verde    { background: #22c55e; }
  .sem-amarillo { background: #f59e0b; }
  .sem-rojo     { background: #ef4444; }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 13px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .empty svg { width: 36px; height: 36px; opacity: .4; }

  /* ── SECTION HEADER ── */
  .section-header { margin-bottom: 24px; }
  .section-header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .section-header p { font-size: 13px; color: var(--text2); }

  /* ── FORM ACTIONS ── */
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; padding-top: 16px; border-top: 1px solid var(--border); margin-top: 8px; }

  /* ── TOTALS ── */
  .totals-row { display: flex; justify-content: flex-end; gap: 20px; font-size: 13px; margin-bottom: 16px; padding: 10px 14px; background: var(--surface2); border-radius: var(--radius); }

  /* ── TOAST ── */
  #toast { position: fixed; bottom: 24px; right: 24px; background: var(--accent); color: var(--accent-text); padding: 11px 18px; border-radius: var(--radius); font-size: 13px; z-index: 999; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 320px; }

  /* ── MODAL ── */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.48); z-index:999; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
  .modal-box { background:var(--surface); border-radius:var(--radius-lg); padding:28px; width:100%; max-width:520px; box-shadow:0 20px 40px rgba(0,0,0,.22); margin:auto; }
  .modal-title { font-size:15px; font-weight:600; margin-bottom:6px; }
  .modal-sub { font-size:13px; color:var(--text2); margin-bottom:18px; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }

  /* ── NOTIFICACIONES ── */
  .notif-btn { position:relative; background:none; border:none; cursor:pointer; padding:6px; border-radius:var(--radius); color:var(--text2); display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .notif-btn:hover { background:var(--surface2); color:var(--text); }
  .notif-btn svg { width:18px; height:18px; }
  .notif-dot { position:absolute; top:-2px; right:-2px; background:#e24b4a; color:#fff; border-radius:10px; padding:1px 5px; font-size:10px; font-weight:700; min-width:16px; text-align:center; display:none; line-height:14px; }
  .notif-panel { position:fixed; top:57px; right:14px; width:340px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); z-index:500; overflow:hidden; display:none; }
  .notif-header { padding:11px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .notif-header span { font-size:13px; font-weight:600; }
  .notif-mark-all { font-size:11px; color:var(--text3); background:none; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .notif-mark-all:hover { color:var(--text); }
  .notif-item { padding:11px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s; }
  .notif-item:last-child { border-bottom:none; }
  .notif-item:hover { background:var(--surface2); }
  .notif-item.unread { background:var(--blue-bg); }
  .notif-item.unread:hover { background:#d6eaf8; }
  .notif-msg { font-size:12px; color:var(--text); line-height:1.45; }
  .notif-time { font-size:10px; color:var(--text3); margin-top:3px; font-family:'DM Mono',monospace; }
  .notif-empty { padding:28px 16px; text-align:center; color:var(--text3); font-size:13px; }

  /* ── COMPAT: variables JS inline ── */
  :root {
    --font-sans: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  /* ── COMPAT: form-grid overrides (requisiciones usa 3-col por defecto) ── */
  .form-grid { grid-template-columns: 1fr 1fr 1fr; }
  .form-grid.two { grid-template-columns: 1fr 1fr; }

  /* ── CONCENTRADO filas expandibles ── */
  .seg-row { cursor: pointer; }
  .seg-row td { transition: background .12s; }
  .seg-row.expanded td { background: var(--blue-bg) !important; }
  .seg-detail td { background: var(--surface2); }
  .seg-chevron { font-size: 10px; color: var(--text3); display: inline-block; transition: transform .2s; }
  .seg-row.expanded .seg-chevron { transform: rotate(90deg); }

  /* ── COMPAT: init hidden ── */
  #app { display: none; }

  svg.icon { width: 15px; height: 15px; flex-shrink: 0; }

  @media (max-width: 900px) {
    .sidebar { width: 56px; }
    .main { margin-left: 56px; }
    .logo-text, .logo-sub, .nav-item span, .sidebar-bottom { display: none; }
    .metrics-grid, .metrics { grid-template-columns: 1fr 1fr; }
    .auth-card-body, .req-card-body { grid-template-columns: 1fr 1fr; }
  }

  /* ── LOGIN ── */
  .login-screen { position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center; }
  .login-box { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;width:100%;max-width:380px;box-shadow:var(--shadow-lg); }
  .login-logo { font-size:20px;font-weight:600;letter-spacing:-.3px;margin-bottom:3px; }
  .login-sub { font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:32px; }
  .login-error { background:var(--red-bg);color:var(--red-text);border:1px solid #f3baba;border-radius:var(--radius);padding:10px 13px;font-size:13px;margin-bottom:16px;display:none; }
  .login-field { display:flex;flex-direction:column;gap:5px;margin-bottom:16px; }
  .login-field label { font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px; }
  .login-field input { font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);width:100%;font-family:'DM Sans',sans-serif;transition:border-color .15s; }
  .login-field input:focus { outline:none;border-color:var(--accent); }
  input[readonly] { background:var(--surface2) !important;color:var(--text3) !important;cursor:default !important;border-style:dashed !important; }
</style>
</head>
<body>

<!-- ══ PANTALLA DE LOGIN ══ -->
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <div class="login-logo">Voxpop</div>
    <div class="login-sub">Sistema de Requisiciones</div>
    <div class="login-error" id="login-error">Correo o contraseña incorrectos.</div>
    <div class="login-field">
      <label>Correo electrónico</label>
      <input type="email" id="login-email" placeholder="tu@voxpop.com.mx" autocomplete="username">
    </div>
    <div class="login-field">
      <label>Contraseña</label>
      <input type="password" id="login-pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>

<script>
  // ─── CONFIGURACIÓN API ────────────────────────────────────────────────────
  // Cambia esta URL a la de tu servidor cuando lo despliegues
  const API_BASE = '/api';

  const ROLE_LABELS = { solicitante:'Solicitante', jefe:'Jefe de área', compras:'Compras' };

  let CURRENT_USER = null;
  let db           = [];   // caché local — se llena desde la API
  let notifications = [];
  let _authToken   = null; // JWT guardado en memoria (no localStorage)

  // ─── API HELPER ───────────────────────────────────────────────────────────
  async function api(path, options = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (_authToken) headers['Authorization'] = 'Bearer ' + _authToken;
    const res = await fetch(API_BASE + path, { ...options, headers });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Error del servidor');
    return json.data;
  }

  // ─── LOGIN / LOGOUT ──────────────────────────────────────────────────────
  function getInitials(name) {
    return (name||'').split(' ').filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join('');
  }

  async function doLogin() {
    const email  = (document.getElementById('login-email').value || '').trim().toLowerCase();
    const pass   = document.getElementById('login-pass').value;
    const errEl  = document.getElementById('login-error');
    const btnEl  = document.getElementById('login-btn');

    if (!email || !pass) { errEl.textContent = 'Ingresa tu correo y contraseña.'; errEl.style.display = 'block'; return; }

    // Deshabilitar botón mientras carga
    if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Ingresando…'; }
    errEl.style.display = 'none';

    try {
      const data = await api('/login.php', {
        method: 'POST',
        body: JSON.stringify({ email, password: pass }),
      });

      _authToken   = data.token;
      const user   = data.usuario;
      CURRENT_USER = {
        email:  user.email,
        name:   user.nombre,
        area:   user.area,
        jefe:   user.jefe,
        role:   user.rol,
        id:     user.id,
      };

      // Cargar datos desde la API
      await loadDB();

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = '';
      document.getElementById('sidebar-user-name').textContent  = user.nombre;
      document.getElementById('sidebar-user-email').textContent = user.email;
      const rs = document.getElementById('role-switcher');
      if (rs) rs.value = user.rol;
      switchRole(user.rol);
      prefillForm();

      // Iniciar polling de notificaciones cada 15s
      startNotifPolling();

      // Si es primer login, forzar cambio de contraseña
      if (user.debeCambiarPass) showCambiarPassModal(true);

    } catch (err) {
      errEl.textContent = err.message === 'Credenciales incorrectas' ? 'Correo o contraseña incorrectos.' : 'Error de conexión. Intenta de nuevo.';
      errEl.style.display = 'block';
      document.getElementById('login-pass').value = '';
    } finally {
      if (btnEl) { btnEl.disabled = false; btnEl.textContent = 'Ingresar'; }
    }
  }

  function doLogout() {
    _authToken   = null;
    CURRENT_USER = null;
    db           = [];
    notifications = [];
    stopNotifPolling();
    document.getElementById('app').style.display         = 'none';
    document.getElementById('login-screen').style.display = '';
    document.getElementById('login-email').value = '';
    document.getElementById('login-pass').value  = '';
    document.getElementById('login-error').style.display = 'none';
  }

  // ─── CAMBIAR CONTRASEÑA ───────────────────────────────────────────────────
  function showCambiarPassModal(forzado = false) {
    removeModal();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modal-main';
    overlay.innerHTML = `
      <div class="modal-box" style="max-width:400px">
        <div class="modal-title">${forzado ? '🔐 Crea tu contraseña' : 'Cambiar contraseña'}</div>
        <div class="modal-sub">${forzado
          ? 'Es tu primer ingreso. Crea una contraseña personal para continuar.'
          : 'Ingresa tu contraseña actual y elige una nueva.'}</div>
        <div class="field" style="margin-bottom:14px">
          <label>Contraseña actual</label>
          <input type="password" id="cp-actual" placeholder="${forzado ? 'voxpop2026' : 'Tu contraseña actual'}"
            style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--font-sans);font-size:13px">
        </div>
        <div class="field" style="margin-bottom:14px">
          <label>Nueva contraseña</label>
          <input type="password" id="cp-nueva" placeholder="Mínimo 6 caracteres"
            style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--font-sans);font-size:13px">
        </div>
        <div class="field" style="margin-bottom:18px">
          <label>Confirmar nueva contraseña</label>
          <input type="password" id="cp-confirmar" placeholder="Repite la nueva contraseña"
            style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--font-sans);font-size:13px">
        </div>
        <div id="cp-error" style="display:none;background:var(--red-bg);color:var(--red-text);border:1px solid var(--red-text);border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:14px"></div>
        <div class="modal-actions">
          ${forzado ? '' : '<button class="btn-ghost" onclick="removeModal()">Cancelar</button>'}
          <button class="btn-sm btn-approve" style="padding:8px 20px" onclick="confirmarCambioPass(${forzado})">
            Guardar contraseña
          </button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    // Si es forzado, no se puede cerrar haciendo clic afuera
    if (!forzado) overlay.addEventListener('click', e => { if (e.target === overlay) removeModal(); });
    setTimeout(() => document.getElementById('cp-actual')?.focus(), 50);
  }

  async function confirmarCambioPass(forzado) {
    const actual    = document.getElementById('cp-actual').value;
    const nueva     = document.getElementById('cp-nueva').value;
    const confirmar = document.getElementById('cp-confirmar').value;
    const errEl     = document.getElementById('cp-error');

    errEl.style.display = 'none';

    if (!actual || !nueva || !confirmar) {
      errEl.textContent = 'Todos los campos son requeridos.';
      errEl.style.display = 'block'; return;
    }
    if (nueva !== confirmar) {
      errEl.textContent = 'Las contraseñas nuevas no coinciden.';
      errEl.style.display = 'block'; return;
    }
    if (nueva.length < 6) {
      errEl.textContent = 'La nueva contraseña debe tener al menos 6 caracteres.';
      errEl.style.display = 'block'; return;
    }

    try {
      await api('/cambiar_pass.php', {
        method: 'POST',
        body: JSON.stringify({ actual, nueva, confirmar }),
      });
      removeModal();
      showToast('✓ Contraseña actualizada correctamente');
    } catch(e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
  }

  function prefillForm() {
    if (!CURRENT_USER) return;
    const { name, area, jefe } = CURRENT_USER;
    const sol = document.getElementById('req-solicitante'); if (sol) sol.value = name;
    const jf  = document.getElementById('req-jefe');        if (jf)  { jf.value = jefe; jf.readOnly = true; }
    function setArea(id) {
      const sel = document.getElementById(id);
      if (!sel) return;
      let found = false;
      for (const opt of sel.options) { if (opt.value === area) { found = true; break; } }
      if (!found) { const o = document.createElement('option'); o.value = area; o.textContent = area; sel.appendChild(o); }
      sel.value = area;
    }
    setArea('req-area');
  }

  // ─── SELECTOR DE ROL ──────────────────────────────────────────────────────
  function switchRole(role) {
    if (!CURRENT_USER) return;
    document.getElementById('sb-name').textContent      = CURRENT_USER.name;
    document.getElementById('sb-role').textContent      = ROLE_LABELS[role];
    document.getElementById('topbar-user').textContent  = CURRENT_USER.name;
    document.getElementById('topbar-role').textContent  = ROLE_LABELS[role];
    document.getElementById('topbar-avatar').textContent = getInitials(CURRENT_USER.name);
    prefillForm();
    applyRoleVisibility();
    updateBadges();
    updateNotifBadge();
    const section = role === 'jefe' ? 'aprobaciones' : role === 'compras' ? 'compras' : 'nueva';
    showSection(section);
  }

  function applyRoleVisibility() {
    const role = CURRENT_USER ? CURRENT_USER.role : 'solicitante';
    const show = (id, visible) => { const el = document.getElementById(id); if(el) el.style.display = visible ? '' : 'none'; };
    show('nav-nueva',        true);
    show('nav-aprobaciones', role === 'jefe');
    show('nav-compras',      role === 'compras');
    show('nav-seguimiento',  role === 'compras');
    show('nav-mis',          true);
  }

  // ─── PERSISTENCIA — reemplaza localStorage con API ───────────────────────
  async function loadDB() {
    try {
      db = await api('/requisiciones.php');
      // normalizar campos para compatibilidad con renders existentes
      db = db.map(normalizeReq);
    } catch(e) {
      console.error('Error cargando datos:', e);
      db = [];
    }
  }

  // Convierte nombres de columnas MySQL (snake_case) a los que usa el JS (camelCase)
  function normalizeReq(r) {
    return {
      ...r,
      folio:            r.folio,
      vin:              r.vin,
      proyecto:         r.proyecto,
      solicitante:      r.solicitante,
      area:             r.area,
      jefe:             r.jefe,
      direccion:        r.direccion,
      specs:            r.specs,
      status:           r.status,
      prioridad:        r.prioridad,
      fechaReq:         r.fecha_req        || '',
      fechaEstimada:    r.fecha_estimada   || '',
      fechaEntrega:     r.fecha_entrega    || '',
      fechaCierre:      r.fecha_cierre     || '',
      aprobadaPor:      r.aprobada_por     || '',
      aprobadaAt:       r.aprobada_en      || '',
      comentariosJefe:  r.comentarios_jefe || '',
      rechazadaPor:     r.rechazada_por    || '',
      rechazadaAt:      r.rechazada_en     || '',
      motivoRechazo:    r.motivo_rechazo   || '',
      entregaNotas:     r.entrega_notas    || '',
      motivoParcial:    r.motivo_parcial   || '',
      encuesta:         r.encuesta         || '',
      proveedorElegido: r.proveedor_elegido|| '',
      createdAt:        r.creado_en        || '',
      createdBy:        r.creado_email     || '',
      arts:             (r.arts || []).map(a => ({
        id:    a.id,
        cant:  parseFloat(a.cantidad),
        unidad:a.unidad,
        desc:  a.descripcion,
        link:  a.link || '',
        cantEntregada: a.cantidad_entregada != null ? parseFloat(a.cantidad_entregada) : null,
        entregado:     a.entregado != null ? !!a.entregado : null,
      })),
      proveedores: (r.proveedores || []).map(p => ({
        nombre: p.nombre_proveedor,
        precio: p.precio,
        notas:  p.notas || '',
      })),
      ordenCompra: r.ordenCompra ? {
        proveedor:    r.ordenCompra.proveedor,
        monto:        r.ordenCompra.monto,
        folioFactura: r.ordenCompra.folio_factura || '',
        fechaCompra:  r.ordenCompra.fecha_compra  || '',
        fechaPago:    r.ordenCompra.fecha_pago     || '',
        fechaAlmacen: r.ordenCompra.fecha_almacen  || '',
      } : null,
    };
  }

  // Refresca solo la requisición que cambió (no recarga todo)
  async function reloadReq(folio) {
    try {
      const updated = await api(`/requisicion.php?folio=${folio}`);
      const norm    = normalizeReq(updated);
      const idx     = db.findIndex(r => r.folio === folio);
      if (idx >= 0) db[idx] = norm; else db.push(norm);
    } catch(e) { console.error('Error recargando req:', e); }
  }

  // saveDB ya no existe — cada acción llama directamente a la API
  function saveDB() { /* no-op: datos se guardan en MySQL via API */ }

  // ─── NAVEGACIÓN ───────────────────────────────────────────────────────────

    renderCompras();
    renderSeguimiento();

  // ─── FOLIO ────────────────────────────────────────────────────────────────
  function genFolio() {
    const n = String(folioCounter++).padStart(4, '0');
    return 'REQ-' + n;
  }

  function today() { return new Date().toISOString().slice(0,10); }

  // ─── DIRECCIÓN ────────────────────────────────────────────────────────────
  function onDirSelectChange() {

    document.getElementById('req-dir-custom').style.display = val === 'otra' ? '' : 'none';

  function getAddressValue() {
    const sel = document.getElementById('req-dir-select').value;
    if (sel === 'darwin')  return 'Darwin 74, Piso 5 Anzures, CP 11590, Delegación Miguel Hidalgo, CDMX';
    if (sel === 'colosio') return 'Blvd. Luis Donaldo Colosio 619 Int. 503, Col. Santa Fe, Entre Calle Las Cruces y Blvd. Las Quintas, Hermosillo, Sonora, C.P. 83249';

  // ─── VALIDACIÓN ───────────────────────────────────────────────────────────
  function validarReq() {
    const errors = [];
    const req = (id, label) => {
      const el = document.getElementById(id);
      if (!el || !el.value.trim()) errors.push({ msg: label, focusId: id });
    };
    req('req-vin',        'VIN / Número de proyecto');
    req('req-proyecto',   'Nombre del proyecto');
    req('req-solicitante','Nombre del solicitante');
    req('req-jefe',       'Jefe directo');
    const area = document.getElementById('req-area');
    if (!area.value) errors.push({ msg: 'Área solicitante', focusId: 'req-area' });
    const dirSel = document.getElementById('req-dir-select');
    if (!dirSel.value) {
      errors.push({ msg: 'Dirección de entrega', focusId: 'req-dir-select' });
    } else if (dirSel.value === 'otra') {
      req('req-dir-calle',   'Dirección — Calle');
      req('req-dir-next',    'Dirección — Número exterior');
      req('req-dir-colonia', 'Dirección — Colonia');
      req('req-dir-ciudad',  'Dirección — Ciudad');
      req('req-dir-estado',  'Dirección — Estado');
      req('req-dir-cp',      'Dirección — Código postal');
    }

    const arts = Array.from(document.querySelectorAll('#art-rows .row-item'));
    const validos = arts.filter(r => r.querySelector('.art-desc')?.value.trim() && parseFloat(r.querySelector('.art-cant')?.value) > 0);
    if (!validos.length) errors.push({ msg: 'Agrega al menos un artículo con cantidad y descripción', focusSelector: '#art-rows .art-desc' });

    return errors;
  }

  function mostrarErroresReq(errors) {
    const form = document.getElementById('nueva-form');
    const old = form.querySelector('.validation-panel');
    if (old) old.remove();
    if (!errors.length) return;

    const panel = document.createElement('div');
    panel.className = 'validation-panel';
    panel.innerHTML = `
      <div class="vp-header">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
        <strong>Faltan ${errors.length} campo${errors.length>1?'s':''} por completar</strong>
      </div>
      <ul class="vp-list">
        ${errors.map((e,i)=>`<li class="vp-item" data-idx="${i}">· ${e.msg}</li>`).join('')}
      </ul>`;
    form.insertBefore(panel, form.firstChild);
    panel.querySelectorAll('.vp-item').forEach((li, i) => {
      const e = errors[i];
      li.addEventListener('click', () => {
        const t = e.focusEl || (e.focusId && document.getElementById(e.focusId)) || (e.focusSelector && document.querySelector(e.focusSelector));
        if (t) { t.scrollIntoView({ behavior:'smooth', block:'center' }); t.focus(); t.classList.add('field-highlight'); setTimeout(()=>t.classList.remove('field-highlight'),1800); }
      });
    });
    panel.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  // ─── SUBMIT ───────────────────────────────────────────────────────────────
  function getReqData() {
    const arts = [];
    document.querySelectorAll('#art-rows .row-item').forEach(r => {
      arts.push({
        cant: parseFloat(r.querySelector('.art-cant')?.value) || 0,
        unidad: r.querySelector('.art-unidad')?.value || '',
        desc: r.querySelector('.art-desc')?.value || '',
        link: r.querySelector('.art-link')?.value || '',
      });
    });
    return {
      vin: document.getElementById('req-vin').value,
      proyecto: document.getElementById('req-proyecto').value,
      solicitante: document.getElementById('req-solicitante').value,
      area: document.getElementById('req-area').value,
      jefe: document.getElementById('req-jefe').value,
      direccion: getAddressValue(),
      specs: document.getElementById('req-specs').value,
      arts,
      status: 'pendiente',
      createdAt: new Date().toISOString(),
      createdBy: CURRENT_USER.email,
    };
  }

  async function saveDraftReq() {
    const errors = validarReq();
    mostrarErroresReq(errors);
    if (errors.length) return;
    const data = { ...getReqData(), status: 'borrador' };
    try {
      await api('/requisiciones.php', { method:'POST', body: JSON.stringify(data) });
      await loadDB();
      showToast('Borrador guardado — ' + data.folio);
      resetNuevaForm();
      updateBadges();
    } catch(e) { showToast('Error al guardar: ' + e.message); }
  }

  async function submitReq() {
    const errors = validarReq();
    mostrarErroresReq(errors);
    if (errors.length) return;
    mostrarErroresReq([]);
    const data = getReqData();
    try {
      const nueva = await api('/requisiciones.php', { method:'POST', body: JSON.stringify(data) });
      db.push(normalizeReq(nueva));
      showToast('✓ Requisición ' + nueva.folio + ' enviada a aprobación');
      resetNuevaForm();
      updateBadges();
      renderAll();
    } catch(e) { showToast('Error al enviar: ' + e.message); }
  }

  function resetNuevaForm() {
    ['req-vin','req-proyecto','req-specs'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    document.getElementById('req-area').value = '';
    document.getElementById('req-dir-select').value = '';
    document.getElementById('req-dir-custom').style.display = 'none';
    ['req-dir-calle','req-dir-next','req-dir-nint','req-dir-colonia','req-dir-ciudad','req-dir-estado','req-dir-cp'].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = '';
    });
    document.getElementById('req-solicitante').value = CURRENT_USER?.name || '';
    document.getElementById('art-rows').innerHTML = '';
    addArtRow();
    const old = document.getElementById('nueva-form').querySelector('.validation-panel');
    if (old) old.remove();
  }

  // ─── COMPRAS ──────────────────────────────────────────────────────────────
  function renderCompras() {
    if (CURRENT_USER?.role !== 'compras') return;
    const cont = document.getElementById('compras-list');

    const todasC = db.filter(r => ['aprobada','parcial','entregada'].includes(r.status));
    const cTotal     = todasC.length;
    const cEntregar  = todasC.filter(r => r.status === 'aprobada').length;
    const cEntregadas= todasC.filter(r => r.status === 'entregada').length;
    const cParcial   = todasC.filter(r => r.status === 'parcial').length;

    const metrics = document.getElementById('compras-metrics');
    if (metrics) metrics.innerHTML = `
      <div class="metric-card" style="cursor:pointer" onclick="setComprasStatusFilter('')">
        <div class="metric-val">${cEntregar + cParcial}</div><div class="metric-label">Total pendientes</div></div>
      <div class="metric-card" style="cursor:pointer" onclick="setComprasStatusFilter('aprobada')">
        <div class="metric-val" style="color:var(--amber-text)">${cEntregar}</div><div class="metric-label">Por entregar</div></div>
      <div class="metric-card" style="cursor:pointer" onclick="setComprasStatusFilter('parcial')">
        <div class="metric-val" style="color:var(--blue-text)">${cParcial}</div><div class="metric-label">Entrega parcial</div></div>`;

    // Poblar selector de mes/año
    const fechaSel = document.getElementById('compras-filter-fecha');
    if (fechaSel) {
      const prev = fechaSel.value;
      const meses = [...new Set(todasC.map(r => r.createdAt?.slice(0,7)).filter(Boolean))].sort().reverse();
      fechaSel.innerHTML = '<option value="">Todas las fechas</option>' +
        meses.map(m => {
          const [y, mo] = m.split('-');
          return `<option value="${m}"${m===prev?' selected':''}>${MESES_ES[parseInt(mo)-1]} ${y}</option>`;
        }).join('');
    }

    const statusFiltro = document.getElementById('compras-filter-status')?.value || '';
    const prioFiltro   = document.getElementById('compras-filter-prio')?.value   || '';
    const fechaFiltro  = document.getElementById('compras-filter-fecha')?.value  || '';
    const search       = (document.getElementById('compras-search')?.value || '').toLowerCase().trim();

    let activas = todasC.filter(r => ['aprobada','parcial'].includes(r.status));
    if (statusFiltro) activas = activas.filter(r => r.status === statusFiltro);
    if (prioFiltro)   activas = activas.filter(r => r.prioridad === prioFiltro);
    if (fechaFiltro)  activas = activas.filter(r => r.createdAt?.startsWith(fechaFiltro));
    if (search)       activas = activas.filter(r =>
      (r.vin||'').toLowerCase().includes(search) ||
      (r.proyecto||'').toLowerCase().includes(search)
    );

    if (!activas.length) {

  function actualizarEstadoArt(i, cantMax) {
    const chk   = document.getElementById(`art-chk-${i}`);
    const cant  = parseFloat(document.getElementById(`art-cant-${i}`)?.value) || 0;
    const badge = document.getElementById(`art-badge-${i}`);
    const row   = document.getElementById(`art-row-${i}`);
    if (!chk || !badge) return;
    if (!chk.checked) {
      badge.className = 'badge badge-pendiente'; badge.textContent = 'Pendiente';
      if (row) row.style.opacity = '.45';
    } else if (cant < cantMax) {
      badge.className = 'badge badge-compras'; badge.textContent = 'Entrega parcial';
      if (row) row.style.opacity = '1';
    } else {
      badge.className = 'badge badge-entregada'; badge.textContent = 'Entregado';
      if (row) row.style.opacity = '1';
    }
  }

    input.style.background  = excede ? 'var(--red-bg)'   : 'var(--surface)';
    if (msg) msg.style.display = excede ? 'block' : 'none';
    actualizarEstadoArt(i, max);

  async function confirmarEntrega(folio) {
    const req = db.find(r => r.folio === folio);
    if (!req) { removeModal(); return; }

    const esSegundaEntrega = req.status === 'parcial';

    const isYaEntregado = (a) => esSegundaEntrega &&
      (a.entregado === true || (a.cantEntregada != null && a.cantEntregada >= a.cant));

    const getCantMax = (a) => (esSegundaEntrega && a.cantEntregada != null)
      ? Math.max(0, a.cant - a.cantEntregada)
      : a.cant;

    const errDiv = document.getElementById('entrega-error-msg');
    const showErr = (msg) => {
      if (errDiv) { errDiv.textContent = msg; errDiv.style.display = 'block'; errDiv.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
    };

    const hayError = (req.arts||[]).some((a,i) => {
      if (isYaEntregado(a)) return false;
      const val = parseFloat(document.getElementById(`art-cant-${i}`)?.value) || 0;
      return val > getCantMax(a);
    });
    if (hayError) { showErr('⚠ Corrige las cantidades — algún artículo supera la cantidad pendiente.'); return; }
    if (errDiv) errDiv.style.display = 'none';

    const artsEntregados = (req.arts||[]).map((a,i) => {
      if (isYaEntregado(a)) {
        return { id: a.id, cant: a.cant, cantEntregada: a.cantEntregada, entregado: a.entregado };
      }
      const nuevaCant     = parseFloat(document.getElementById(`art-cant-${i}`)?.value) || 0;
      const checked       = document.getElementById(`art-chk-${i}`)?.checked ?? true;
      const prevEntregada = (esSegundaEntrega && a.cantEntregada != null) ? a.cantEntregada : 0;
      const totalEntregada = checked ? prevEntregada + nuevaCant : prevEntregada;
      return {
        id:            a.id,
        cant:          a.cant,
        cantEntregada: totalEntregada,
        entregado:     checked && totalEntregada >= a.cant,
      };
    });

    const esCompleta = artsEntregados.every(a => a.entregado && a.cantEntregada >= a.cant);

    if (!esCompleta) {
      const motivo = (document.getElementById('m-entrega-motivo')?.value || '').trim();
      if (!motivo) {
        showErr('⚠ Escribe el motivo de la entrega parcial para poder confirmar.');
        document.getElementById('m-entrega-motivo')?.focus();
        return;
      }
    }

    try {
      await api(`/requisicion.php?folio=${folio}`, {
        method: 'PATCH',
        body: JSON.stringify({
          accion:        'entregar',
          artsEntregados,
          notas:         document.getElementById('m-entrega-notas').value,
          motivoParcial: esCompleta ? '' : (document.getElementById('m-entrega-motivo')?.value || ''),
          fechaEntrega:  document.getElementById('m-entrega-fecha').value,
        }),
      });
      await reloadReq(folio);
      removeModal();
      renderAll();
      showToast(esCompleta ? '✓ Requisición entregada completamente' : '⚠ Entrega parcial registrada — quedan artículos pendientes');
    } catch(e) { showToast('Error: ' + e.message); }
  }

  // ─── NOTIFICACIONES — API polling ────────────────────────────────────────
  let _notifInterval = null;

  function startNotifPolling() {
    fetchNotifs();                                  // inmediato al login
    _notifInterval = setInterval(fetchNotifs, 15000); // cada 15 segundos
  }
  function stopNotifPolling() {
    clearInterval(_notifInterval);
    _notifInterval = null;
  }

  async function fetchNotifs() {
    try {
      const data = await api('/notificaciones.php');
      notifications = (data.notificaciones || []).map(n => ({
        id:   n.id,
        msg:  n.mensaje,
        time: n.creado_en,
        read: !!n.leida,
      }));
      updateNotifBadge();
    } catch(e) {}
  }

  function updateNotifBadge() {
    const unread = notifications.filter(n => !n.read).length;
    const badge  = document.getElementById('notif-badge');
    badge.textContent = unread || '';
    badge.style.display = unread > 0 ? 'block' : 'none';
  }

  function toggleNotifPanel() {
    const panel = document.getElementById('notif-panel');
    const isOpen = panel.style.display === 'block';
    panel.style.display = isOpen ? 'none' : 'block';
    if (!isOpen) renderNotifPanel();
  }

  function renderNotifPanel() {
    const list = document.getElementById('notif-list');
    if (!notifications.length) {
      list.innerHTML = '<div class="notif-empty">Sin notificaciones</div>';
      return;
    }
    list.innerHTML = [...notifications].reverse().map(n => `
      <div class="notif-item${n.read ? '' : ' unread'}" onclick="markRead(${n.id})">
        <div class="notif-msg">${n.msg}</div>
        <div class="notif-time">${fmtDate((n.time||'').slice(0,10))}</div>
      </div>`).join('');
  }

  async function markRead(id) {
    const n = notifications.find(x => x.id === id);
    if (n) { n.read = true; renderNotifPanel(); updateNotifBadge(); }
    try { await api('/notificaciones.php', { method:'PATCH', body: JSON.stringify({ id }) }); } catch(e) {}
  }

  async function markAllRead() {
    notifications.forEach(n => n.read = true);
    renderNotifPanel();
    updateNotifBadge();
    try { await api('/notificaciones.php', { method:'PATCH', body: JSON.stringify({ id:'all' }) }); } catch(e) {}
  }

  // ─── EXPORTAR CSV ─────────────────────────────────────────────────────────
  function exportConcentradoCSV() {
    const todasSeg = db.filter(r => ['aprobada','parcial','entregada'].includes(r.status));

    const filterStatus = document.getElementById('seg-filter-status')?.value || '';
    const prioFiltro   = document.getElementById('seg-filter-prio')?.value   || '';
    const fechaFiltro  = document.getElementById('seg-filter-fecha')?.value  || '';
    const search       = (document.getElementById('seg-search')?.value || '').toLowerCase();

    let reqs = [...todasSeg];
    if (filterStatus) reqs = reqs.filter(r => r.status === filterStatus);
    if (prioFiltro)   reqs = reqs.filter(r => r.prioridad === prioFiltro);
    if (fechaFiltro)  reqs = reqs.filter(r => r.createdAt?.startsWith(fechaFiltro));
    if (search)       reqs = reqs.filter(r =>
      (r.vin||'').toLowerCase().includes(search) ||
      (r.proyecto||'').toLowerCase().includes(search) ||
      (r.solicitante||'').toLowerCase().includes(search)
    );

    if (!reqs.length) { showToast('Sin datos para exportar'); return; }

    const SEG_LABEL = { aprobada:'Por entregarse', parcial:'Entrega parcial', entregada:'Entregada' };
    const PRIO_LABEL = { alto:'Alta', medio:'Media', bajo:'Baja' };

    const headers = [
      'Folio', 'VIN', 'Proyecto', 'Solicitante', 'Área', 'Prioridad',
      'Estatus', 'Fecha de solicitud', 'Fecha estimada', 'Fecha de entrega',
      'Dirección', 'Aprobada por', 'Artículos solicitados', 'Notas de entrega',
    ];

    const rows = reqs.map(r => [
      r.folio,
      r.vin,
      r.proyecto,
      r.solicitante,
      r.area || '',
      PRIO_LABEL[r.prioridad] || '',
      SEG_LABEL[r.status] || r.status,
      r.createdAt?.slice(0,10) || '',
      r.fechaEstimada || '',
      r.fechaEntrega  || '',
      r.direccion     || '',
      r.aprobadaPor   || '',
      (r.arts||[]).map(a => `${a.cant} ${a.unidad} - ${a.desc}`).join(' | '),
      r.entregaNotas  || '',
    ]);

    const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const csv = [headers, ...rows].map(row => row.map(esc).join(',')).join('\r\n');

    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `concentrado_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`✓ ${reqs.length} registros exportados`);
  }

  // ─── INIT ─────────────────────────────────────────────────────────────────
  db = [];
  notifications = [];
  addArtRow();

  // Permitir login con Enter en los campos
  ['login-email','login-pass'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  });
</script>
</body>
</html>
